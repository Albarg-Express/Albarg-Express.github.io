<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Admin — ALBARG Express</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css">
<script>
  (function () {
    var t = localStorage.getItem("albarg_theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>

<div class="admin-wrap">
  <div class="admin-header">
    <img src="assets/logo.png" alt="ALBARG Express logo">
    <h1 data-i18n="admin_title">ALBARG Express — Rate Admin</h1>
    <div class="header-controls" style="margin-inline-start:auto;">
      <div class="lang-toggle seg-toggle">
        <button type="button" data-lang="ar">عربي</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <div class="theme-toggle seg-toggle">
        <button type="button" data-theme="light" aria-label="Light mode">☀️</button>
        <button type="button" data-theme="dark" aria-label="Dark mode">🌙</button>
      </div>
    </div>
  </div>

  <div class="admin-card">
    <h2 data-i18n="current_title">Current Currencies</h2>
    <div class="table-scroll">
      <table class="admin-table">
        <thead>
          <tr>
            <th data-i18n="th_code">Code</th>
            <th data-i18n="th_name">Name</th>
            <th data-i18n="th_sell">Sell Rate</th>
            <th data-i18n="th_buy">Buy Rate</th>
            <th data-i18n="th_updated">Last Updated</th>
            <th data-i18n="th_actions">Actions</th>
          </tr>
        </thead>
        <tbody id="admin-table-body"></tbody>
      </table>
    </div>
    <div class="status-msg" id="status-msg"></div>
  </div>

  <div class="admin-card">
    <h2 data-i18n="add_title">Add Currency</h2>
    <form id="add-form" class="add-form">
      <div>
        <label for="new-code" data-i18n="lbl_code">Code</label>
        <input type="text" id="new-code" placeholder="EUR" maxlength="5" required>
      </div>
      <div>
        <label for="new-name" data-i18n="lbl_name">Name</label>
        <input type="text" id="new-name" placeholder="Euro">
      </div>
      <div>
        <label for="new-sell" data-i18n="lbl_sell">Sell Rate</label>
        <input type="number" id="new-sell" step="any" min="0" placeholder="5.4" required>
      </div>
      <div>
        <label for="new-buy" data-i18n="lbl_buy">Buy Rate</label>
        <input type="number" id="new-buy" step="any" min="0" placeholder="5.2" required>
      </div>
      <button type="submit" class="btn btn-primary" data-i18n="btn_add">Add Currency</button>
    </form>
  </div>

  <footer>
    <div>&copy; <span id="year"></span> ALBARG Express — <span data-i18n="admin_footer">Admin</span></div>
  </footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
